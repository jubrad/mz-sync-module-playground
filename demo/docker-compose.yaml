services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5488:5432"
    command: >
      postgres
        -c wal_level=logical
        -c max_wal_senders=10
        -c max_replication_slots=10
    # volumes:
    #   - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  materialize:
    # image: materialize/materialized:latest
    image: materialize/materialized:v26.24.0-dev.0--pr.g9a5b17bdaa0f69293815c6b6d2531b38bef6ba80-fdb
    ports:
      - "6878:6875"
      - "6879:6877"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MZ_NO_TELEMETRY: "1"
      MZ_WORKERS: "10"

volumes:
  pg_data:
